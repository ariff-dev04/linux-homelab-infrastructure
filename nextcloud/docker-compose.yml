services:
  nextcloud-db:
    container_name: nextcloud_db
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - ./db-data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

  nextcloud-redis:
    container_name: nextcloud_redis
    image: redis:7-alpine
    networks:
      - default
    restart: unless-stopped

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=nextcloud-db
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.ariffzakaria.dev localhost 127.0.0.1
      - OVERWRITEPROTOCOL=https
    ports:
      - "127.0.0.1:8089:80/tcp"
    volumes:
      - ./nc-data:/var/www/html
    networks:
      - default
      - homelab_ingress
    restart: unless-stopped

  nextcloud-cron:
    container_name: nextcloud_cron
    image: nextcloud:latest
    entrypoint: /cron.sh
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    volumes:
      - ./nc-data:/var/www/html
    networks:
      - default
    restart: unless-stopped

networks:
  homelab_ingress:
    external: true
