# Dynamically scale CPU from 1.2 GHz (idle) to 3.0 GHz (under container load)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance

# Allow full 3.0 GHz base capacity, keep 3.7 GHz Turbo off to prevent thermal spikes
CPU_BOOST_ON_AC=0
CPU_SCALING_MIN_FREQ_ON_AC=1200000
CPU_SCALING_MAX_FREQ_ON_AC=3000000

# CRITICAL: Disable Wi-Fi Power Saving so wlp2s0 never drops its DHCPv4 lease
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Keep PCIe bus awake for network stability
PCIE_ASPM_ON_AC=default
