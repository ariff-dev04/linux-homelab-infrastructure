services:
  nginx:
    container_name: nginx-web
    image: nginx:alpine
    ports:
      - "80:80/tcp"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    networks:
      - default
      - homelab_ingress
    restart: unless-stopped

networks:
  homelab_ingress:
    external: true
