# 1. Your Existing Homelab Portfolio Dashboard (ariff.lab or IP address)
server {
    listen 80 default_server;
    server_name ariff.lab _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

# 2. OpenRVM User-Facing Recycler Web App (rvm.ariff.lab)
server {
    listen 80;
    server_name rvm.ariff.lab;

    location / {
        proxy_pass http://openrvm_ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 3. OpenRVM Merchant Admin Platform (admin.rvm.ariff.lab)
server {
    listen 80;
    server_name admin.rvm.ariff.lab;

    location / {
        proxy_pass http://openrvm_ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
